include:
  - path: ../eudi-srv-issuer-oidc-py/docker-compose.yml
  - path: ../eudi-srv-web-issuing-frontend-eudiw-py/docker-compose.yml

services:
  issuer_backend:
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-web-issuing-eudiw-py:latest
    ports:
      - "5000:5000"
    volumes:
      - /etc/eudiw/pid-issuer-dev/cert/:/etc/eudiw/pid-issuer-dev/cert/:ro
      - /etc/eudiw/pid-issuer-dev/privKey/:/etc/eudiw/pid-issuer-dev/privKey/:ro
      - /tmp/log_dev:/tmp/log_dev
      - /etc/issuer_config/config_issuer_backend.yaml:/etc/issuer_config/config_issuer_backend.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles: ["base"]

  issuer_backend_postgres_local:
    image: postgres:16
    environment:
      POSTGRES_DB: eudiw_issuer
      POSTGRES_USER: issuer_backend
      POSTGRES_PASSWORD: secret_here
    volumes:
      - issuer_backend_postgres_local_data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles: ["local"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuer_backend -d eudiw_issuer"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  issuer_backend_local:
    build:
      context: .
      dockerfile: Dockerfile.local
    command: flask run --host=0.0.0.0 --cert=/certs/tls/localhost+2.pem --key=/certs/tls/localhost+2-key.pem
    ports:
      - "5001:5000"
    volumes:
      - ../eudi-srv-issuer-oidc-py/script/certs/trusted_cas/:/etc/eudiw/pid-issuer-dev/cert/:ro
      - ../eudi-srv-issuer-oidc-py/script/certs/privKey/:/etc/eudiw/pid-issuer-dev/privKey/:ro
      - ../eudi-srv-issuer-oidc-py/script/certs/tls/localhost+2.pem:/certs/tls/localhost+2.pem:ro
      - ../eudi-srv-issuer-oidc-py/script/certs/tls/localhost+2-key.pem:/certs/tls/localhost+2-key.pem:ro
      - /tmp/log_dev:/tmp/log_dev
      - ./app/metadata_config/metadata_config_local.json:/app/app/metadata_config/metadata_config.json:ro
      - ./app/metadata_config/openid-configuration_local.json:/app/app/metadata_config/openid-configuration.json:ro
      - ./app/route_oidc_local.py:/app/app/route_oidc.py:ro
      - ./app/dynamic_func_local.py:/app/app/dynamic_func.py:ro
      - ./app/route_dynamic_local.py:/app/app/route_dynamic.py:ro
      - ./app/formatter_func_local.py:/app/app/formatter_func.py:ro
      - ./app/revocation_local.py:/app/app/revocation.py:ro
      - ./app/route_oid4vp_local.py:/app/app/route_oid4vp.py:ro
      - ./app/app_config/config_countries_local.py:/app/app/app_config/config_countries.py:ro
      - ./app/app_config/config_service_local.py:/app/app/app_config/config_service.py:ro
      - ./app/config_issuer_backend_local.yaml:/etc/issuer_config/config_issuer_backend.yaml:ro
      - ./app/metadata_config/credentials_supported:/app/app/metadata_config/credentials_supported:ro
    env_file:
      - app/.env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles: ["local"]
    depends_on:
      issuer_backend_postgres_local:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, ssl; ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE; urllib.request.urlopen('https://localhost:5000/.well-known/openid-credential-issuer', context=ctx)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  issuer_backend_postgres_local_data: